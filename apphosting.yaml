# Ressources du serveur Cloud Run (pas de la machine de build).
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 2048

env:
  # Remplacer les valeurs REPLACE_WITH_* avant le premier rollout.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://demenagement-local.fr
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_VERTICAL
    value: demenagement
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBw1I4H_XLBvND5_WnLWQ15tGBwxeIOeNU
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: leads-engine-7067b.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: leads-engine-7067b
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:128826641052:web:a2e5e9e6add50f359bbb59
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: leads-engine-7067b
    availability: [RUNTIME]

  - variable: ADMIN_EMAILS
    value: contact@vsw-digital.fr
    availability: [RUNTIME]

  - variable: ADMIN_NOTIFICATION_EMAIL
    value: contact@vsw-digital.fr
    availability: [RUNTIME]
  - variable: EMAIL_FROM_RENOVATION
    value: "Rénovizo <notifications@renovizo.fr>"
    availability: [RUNTIME]
  - variable: EMAIL_FROM_DEMENAGEMENT
    value: "Déménizo <notifications@demenizo.fr>"
    availability: [RUNTIME]

  # Ajouter RESEND_API_KEY_RENOVATION et RESEND_API_KEY_DEMENAGEMENT
  # après création des secrets et attribution de leurs accès au backend.
# Stripe reste désactivé en attendant son provisionnement.
# Voir DEPLOYMENT.md. Les Cloud Functions ont leur propre configuration.
