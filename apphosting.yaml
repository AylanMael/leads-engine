# Ressources du serveur Cloud Run (pas de la machine de build).
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 2048

env:
  # Remplacer les valeurs REPLACE_WITH_* avant le premier rollout.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://demenagement-local.fr
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_VERTICAL
    value: demenagement
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REPLACE_WITH_FIREBASE_WEB_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REPLACE_WITH_FIREBASE_AUTH_DOMAIN
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REPLACE_WITH_FIREBASE_PROJECT_ID
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REPLACE_WITH_FIREBASE_WEB_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_ADMIN_PROJECT_ID
    value: REPLACE_WITH_FIREBASE_PROJECT_ID
    availability: [RUNTIME]

# Premier déploiement sans Stripe ni notifications : aucun secret externe requis.
# Réactiver les intégrations après provisionnement des secrets et de leurs accès.
# Voir DEPLOYMENT.md. Les Cloud Functions ont leur propre configuration.
